spring.application.name=biblioteca
server.port=8081
# Este avance sin login se ejecuta solamente en el computador local.
server.address=127.0.0.1
# Aqui se conecta Java con MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Las tablas se crean con el archivo SQL, no desde Java.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
# Crea dos cuentas para practicar al iniciar por primera vez.
app.datos-ejemplo=${DATOS_EJEMPLO:true}
